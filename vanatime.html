<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>VanaTimer Web</title>
    <link rel="stylesheet" href="vana-timer/styles.css">
</head>

<body>
    <main class="timer">
        <h1>Next Vana-day In</h1>
        <div id="countdown">--:--</div>
        <span id="next-vana-datetime">--</span>

        <section class="info">
            <p>Current Vana Time: <span id="vana-time">--:--</span></p>
            <p>Current Vana Day: <span id="vana-day">----</span></p>
            <p>Time until Tokyo Midnight: <span id="tokyo-midnight-countdown">--:--:--</span></p>
            <p>Next Reset (Local): <span id="next-reset">--:--</span></p>
        </section>
    </main>

    <script src="vana-timer/script.js"></script>
</body>

</html>
