<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="utf-8">
    <title>VanaTimer Web</title>
    <!-- at the top of vanatime.html -->
    <link rel="stylesheet" href="vana-timer/styles.css">
    <link rel="stylesheet" href="vana-timer/styles.css">
    <link rel="manifest" href="vana-timer/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- OpenGraph meta tags -->
    <meta property="og:title" content="VanaTimer Web" />
    <meta property="og:description" content="Vana'diel time, next Vana-day, Tokyo midnight countdown, and Dynamis mob timers for FFXI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meternx01.github.io/vanatime" />
<!--    <meta property="og:image" content="https://catseyexi.com/og-image.png" />-->
</head>

<body>
    <!-- Tab buttons -->
    <div class="tabs">
        <button class="tab-button active" data-tab="vana">Vana-Day Timer</button>
        <button class="tab-button" data-tab="dynamis">Dynamis Mob Timer</button>
    </div>

    <!-- Tab panels -->
    <div class="tab-panel active" id="vana">
        <div class="card timer-card">
            <h1>Next Vana-day In</h1>
            <div id="countdown" class="countdown-text">--:--</div>
            <section class="info">
                <p>Next Vana-Day (Earth): <span id="next-vana-datetime">--</span></p>
                <p>Current Vana Time: <span id="vana-time">--:--</span></p>
<!--                <p>Current Vana Day: <span id="vana-day">&#45;&#45;&#45;&#45;</span></p>-->
                <p>Time until Tokyo Midnight: <span id="tokyo-midnight-countdown">--:--:--</span></p>
                <p>Next Reset (Mon 00:00 JST): <span id="next-reset">--</span></p>
            </section>
        </div>
    </div>

    <div class="tab-panel" id="dynamis">
        <div class="card mob-card">

            <h4>Mobs to target for JA Red/White Proc's</h4>
            <p><strong>Mobs:</strong></p>
            <p><span id="mob-currency">--</span></p> <span id="mob-names">--</span>

           <section class="info">
            <p><strong>Time Remaining:</strong></p> <span id="mob-countdown" class="countdown-text">--:--</span>
           </section>
        </div>
    </div>

    <!-- scripts (in this order) -->
    <script src="vana-timer/script.js"></script>
    <script src="vana-timer/dynamis.js"></script>
    <script src="vana-timer/main.js"></script>
    <script src="vana-timer/tabs.js"></script>

</body>

</html>
